<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON — Michel &amp; the Mainframe</title>
<meta name="description" content="NEON, the new album by Michel &amp; the Mainframe. Release date: 1st October 2026.">
<meta property="og:title" content="NEON — Michel & the Mainframe">
<meta property="og:description" content="System initializing… Release date: 1st October 2026.">
<meta property="og:image" content="poster.jpg">
<meta property="og:type" content="music.album">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#050505">
<style>
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  video { width: 100vw; height: 100vh; object-fit: contain; display: block; background: #050505; }
  #sound {
    position: fixed; right: 18px; bottom: 18px;
    font: 600 13px/1 "DejaVu Sans Mono", Menlo, Consolas, monospace; letter-spacing: .08em;
    color: #78ffc8; background: rgba(0,0,0,.55); border: 1px solid rgba(120,255,200,.35);
    border-radius: 6px; padding: 10px 14px; cursor: pointer;
    transition: opacity .6s;
  }
  #sound:hover { border-color: #78ffc8; }
  #sound.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <video id="v" src="neon.mp4" poster="poster.jpg" autoplay muted playsinline preload="auto"
         aria-label="NEON by Michel & the Mainframe. Release date: 1st October 2026."></video>
  <button id="sound" type="button">&gt; SOUND ON_</button>
<script>
  const v = document.getElementById('v'), b = document.getElementById('sound');
  const HOLD = 13.3; // last frame with the full text, before the fade
  v.addEventListener('ended', () => { v.currentTime = HOLD; v.pause(); b.textContent = '> REPLAY_'; b.dataset.mode = 'replay'; b.classList.remove('hide'); });
  b.addEventListener('click', () => {
    v.muted = false;
    v.currentTime = 0;
    v.play();
    b.classList.add('hide');
  });
</script>
</body>
</html>
